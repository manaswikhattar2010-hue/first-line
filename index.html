<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 01 — The print statement</title>
<style>
  :root {
    --bg: #14151f;
    --panel: #1e2030;
    --panel-border: #2e3148;
    --text: #c8cce0;
    --text-dim: #7d81a0;
    --keyword: #9ece6a;
    --string: #e0af68;
    --accent: #7dcfff;
    --error: #f7768e;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(125, 207, 255, 0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(158, 206, 106, 0.06), transparent 40%);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 20px;
  }

  .window {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #191a28;
    border-bottom: 1px solid var(--panel-border);
  }

  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.red { background: #f7768e; }
  .dot.yellow { background: #e0af68; }
  .dot.green { background: #9ece6a; }

  .filename {
    margin-left: 8px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-dim);
  }

  .content {
    padding: 28px 28px 24px;
  }

  h1 {
    font-size: 21px;
    line-height: 1.35;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--text);
    max-width: 30ch;
  }

  p {
    font-size: 15px;
    line-height: 1.65;
    color: var(--text-dim);
    margin: 0 0 12px;
    max-width: 46ch;
  }

  code, .snippet {
    font-family: var(--font-mono);
    font-size: 0.92em;
    color: var(--accent);
    background: rgba(125, 207, 255, 0.08);
    padding: 1px 6px;
    border-radius: 4px;
  }

  .example {
    font-family: var(--font-mono);
    font-size: 14px;
    background: #14151f;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 12px 16px;
    margin: 18px 0 22px;
  }
  .example .kw { color: var(--keyword); }
  .example .str { color: var(--string); }
  .example .out { color: var(--text-dim); margin-top: 6px; }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 14px;
    background: #14151f;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  button {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    background: var(--keyword);
    color: #14151f;
    border: none;
    padding: 0 20px;
    border-radius: 6px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .console {
    margin-top: 18px;
    min-height: 24px;
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .console .prompt {
    color: var(--text-dim);
  }

  .console.success { color: var(--keyword); }
  .console.error { color: var(--error); }

  @media (prefers-reduced-motion: no-preference) {
    .console.flash { animation: flash-in 0.25s ease; }
  }
  @keyframes flash-in {
    from { opacity: 0; transform: translateY(-2px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="window">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="filename">lesson_01.py</span>
    </div>

    <div class="content">
      <h1>The print statement</h1>
      <p>
        In Python, <code>print()</code> is how your program talks back to you.
        Whatever you put inside the parentheses gets shown on the screen.
        Text goes inside quotes, like this:
      </p>

      <div class="example">
        <div><span class="kw">print</span>(<span class="str">"Hello World"</span>)</div>
        <div class="out">Hello World</div>
      </div>

      <p>Try it yourself. Type the line above exactly as shown.</p>

      <label for="code-input">Your code</label>
      <div class="input-row">
        <input
          type="text"
          id="code-input"
          autocomplete="off"
          spellcheck="false"
          placeholder='print("Hello World")'
        />
        <button id="check-btn">Run</button>
      </div>

      <div class="console" id="console"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('code-input');
    const button = document.getElementById('check-btn');
    const consoleEl = document.getElementById('console');
    const target = 'print("Hello World")';

    function normalize(str) {
      // Treat single and double quotes as equivalent, trim outer whitespace
      return str.trim().replace(/'/g, '"');
    }

    function showResult() {
      const value = input.value;
      const clean = normalize(value);
      const cleanTarget = normalize(target);

      consoleEl.classList.remove('flash');
      void consoleEl.offsetWidth; // restart animation
      consoleEl.classList.add('flash');

      if (clean === cleanTarget) {
        consoleEl.className = 'console success flash';
        consoleEl.textContent = 'Hello World\n\nNice work — that ran perfectly.';
      } else if (clean.length === 0) {
        consoleEl.className = 'console error flash';
        consoleEl.textContent = 'Type the line into the box above, then press Run.';
      } else {
        consoleEl.className = 'console error flash';
        let hint = 'Not quite. ';
        if (!clean.includes('print')) {
          hint += 'Start with the word print.';
        } else if (!clean.includes('(') || !clean.includes(')')) {
          hint += 'print needs parentheses right after it: print(...)';
        } else if (!clean.includes('"')) {
          hint += 'Text needs to sit inside quotes: "Hello World"';
        } else if (clean.toLowerCase().replace(/\s/g, '') !== cleanTarget.toLowerCase().replace(/\s/g, '')) {
          hint += 'Check the spelling and capitalization of Hello World.';
        } else {
          hint += 'Check for extra or missing spaces.';
        }
        consoleEl.textContent = hint;
      }
    }

    button.addEventListener('click', showResult);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') showResult();
    });
  </script>

</body>
</html>
